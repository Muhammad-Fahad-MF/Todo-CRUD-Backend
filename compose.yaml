services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/tasks
    depends_on: [db]
  db:
    image: postgres
    environment:
      POSTGRES_DB: {POSTGRES_DB}
      POSTGRES_PASSWORD: {POSTGRES_PASSWORD}
    volumes: [taskdata:/var/lib/postgresql/data]
    
volumes:
  taskdata:
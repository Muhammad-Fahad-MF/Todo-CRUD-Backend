services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB} # in this url, postgres is the username.
    depends_on: [db]
  db:
    image: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - taskdata:/var/lib/postgresql
  redis:
    image: redis:alpine
    volumes:
      - redisdata:/data

volumes:
  taskdata:
  redisdata: